    <rect x="698" y="420" width="230" height="112" fill="#fbfdff" stroke="#52606d" stroke-width="1.4"/>
    <line x1="698" y1="454" x2="928" y2="454" stroke="#52606d"/>
    <text x="713" y="438" class="stereo">&lt;&lt;复制副本&gt;&gt;</text>
    <text x="713" y="474" class="objectName">PlayerState_0</text>
    <text x="713" y="492" class="objectType">AProjectAegisPlayerState</text>
