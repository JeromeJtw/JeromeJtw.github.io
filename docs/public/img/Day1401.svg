    <rect x="370" y="420" width="230" height="112" fill="#fffdf7" stroke="#52606d" stroke-width="1.4"/>
    <line x1="370" y1="454" x2="600" y2="454" stroke="#52606d"/>
    <text x="385" y="438" class="stereo">&lt;&lt;实例&gt;&gt;</text>
    <text x="385" y="474" class="objectName">PlayerState_0</text>
    <text x="385" y="492" class="objectType">AProjectAegisPlayerState</text>
