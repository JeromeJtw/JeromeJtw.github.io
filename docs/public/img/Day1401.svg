    <text x="575" y="149" class="objectType">ULocalPlayer</text>

    <rect x="810" y="82" width="280" height="84" fill="#f8fafc" stroke="#52606d" stroke-width="1.4"/>
    <line x1="810" y1="112" x2="1090" y2="112" stroke="#52606d"/>
    <text x="825" y="101" class="stereo">&lt;&lt;实例&gt;&gt;</text>
    <text x="825" y="130" class="objectName">LocalSettingsSubsystem_0</text>
    <text x="825" y="149" class="objectType">UAegisLocalSettingsSubsystem</text>

    <line x1="230" y1="124" x2="285" y2="124" stroke="#333333" stroke-width="1.4" marker-start="url(#diamond)"/>
    <text x="257" y="116" text-anchor="middle" class="relation">外部对象</text>
    <line x1="750" y1="124" x2="810" y2="124" stroke="#333333" stroke-width="1.4" marker-start="url(#diamond)"/>
    <text x="780" y="116" text-anchor="middle" class="relation">外部对象</text>
  </g>

