    <rect x="40" y="830" width="1200" height="66" fill="#f8fafc" stroke="#9fb3c8" stroke-width="1.2"/>
    <text x="58" y="853" class="legend">图例：</text>
    <line x1="112" y1="849" x2="170" y2="849" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
