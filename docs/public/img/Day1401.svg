<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="910" viewBox="0 0 1280 910">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="openArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333333" stroke-width="1.4"/>
    </marker>
    <marker id="diamond" markerWidth="18" markerHeight="14" refX="2" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,7 L10,1 L18,7 L10,13 z" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
    </marker>
    <style>
      .title { font: 700 23px Arial, sans-serif; fill: #1f2933; }
      .subtitle { font: 13px Arial, sans-serif; fill: #52606d; }
      .worldTitle { font: 700 16px Arial, sans-serif; fill: #243b53; }
      .worldMeta { font: 12px Arial, sans-serif; fill: #52606d; }
      .stereo { font: 11px Arial, sans-serif; fill: #52606d; }
      .objectName { font: 700 13px Arial, sans-serif; fill: #102a43; }
      .objectType { font: 12px Arial, sans-serif; fill: #334e68; }
      .body { font: 11px Arial, sans-serif; fill: #334e68; }
      .relation { font: 11px Arial, sans-serif; fill: #243b53; }
      .legend { font: 11px Arial, sans-serif; fill: #334e68; }
    </style>
  </defs>

  <rect width="1280" height="910" fill="#ffffff"/>
  <text x="40" y="38" class="title">Project Aegis - Gameplay Framework 运行时实例图</text>
  <text x="40" y="61" class="subtitle">UML 对象视图 | UE 5.8 | Listen Server PIE 上下文 | 不是类继承图</text>

  <!-- Cross-world local lifetime objects -->
  <g>
    <rect x="40" y="82" width="190" height="84" fill="#f8fafc" stroke="#52606d" stroke-width="1.4"/>
    <line x1="40" y1="112" x2="230" y2="112" stroke="#52606d"/>
    <text x="55" y="101" class="stereo">&lt;&lt;实例&gt;&gt;</text>
    <text x="55" y="130" class="objectName">GameInstance_0</text>
    <text x="55" y="149" class="objectType">UGameInstance</text>

    <rect x="285" y="82" width="240" height="84" fill="#f8fafc" stroke="#52606d" stroke-width="1.4"/>
    <line x1="285" y1="112" x2="525" y2="112" stroke="#52606d"/>
    <text x="300" y="101" class="stereo">&lt;&lt;实例&gt;&gt;</text>
    <text x="300" y="130" class="objectName">SessionSubsystem_0</text>
    <text x="300" y="149" class="objectType">UAegisSessionSubsystem</text>

    <rect x="560" y="82" width="190" height="84" fill="#f8fafc" stroke="#52606d" stroke-width="1.4"/>
    <line x1="560" y1="112" x2="750" y2="112" stroke="#52606d"/>
    <text x="575" y="101" class="stereo">&lt;&lt;实例&gt;&gt;</text>
