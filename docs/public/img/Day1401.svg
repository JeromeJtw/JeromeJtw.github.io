    <rect x="68" y="577" width="230" height="92" fill="#fffdf7" stroke="#52606d" stroke-width="1.4"/>
    <line x1="68" y1="611" x2="298" y2="611" stroke="#52606d"/>
    <text x="83" y="595" class="stereo">&lt;&lt;临时 Pawn&gt;&gt;</text>
    <text x="83" y="631" class="objectName">ObserverPawn_0</text>
    <text x="83" y="649" class="objectType">BP_AegisObserverPawn</text>

    <rect x="370" y="577" width="230" height="92" fill="#fffdf7" stroke="#52606d" stroke-width="1.4"/>
    <line x1="370" y1="611" x2="600" y2="611" stroke="#52606d"/>
    <text x="385" y="595" class="stereo">&lt;&lt;实例&gt;&gt;</text>
    <text x="385" y="631" class="objectName">Character_0</text>
    <text x="385" y="649" class="objectType">AProjectAegisCharacter</text>
    <text x="385" y="667" class="body">身体 | 移动 | 碰撞</text>

    <rect x="370" y="700" width="230" height="92" fill="#fffdf7" stroke="#52606d" stroke-width="1.4"/>
    <line x1="370" y1="734" x2="600" y2="734" stroke="#52606d"/>
