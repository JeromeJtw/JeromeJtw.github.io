    <rect x="1000" y="420" width="230" height="112" fill="#fbfdff" stroke="#52606d" stroke-width="1.4"/>
    <line x1="1000" y1="454" x2="1230" y2="454" stroke="#52606d"/>
    <text x="1015" y="438" class="stereo">&lt;&lt;复制副本&gt;&gt;</text>
